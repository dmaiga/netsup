{% load static %}
<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/png" href="{% static 'images/logonetsup.png' %}">
    <link rel="apple-touch-icon" href="{% static 'images/logonetsup.png' %}">
   
    <title>Connexion | NETSUP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet"/>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { brandBlue: '#0056b3', brandRed: '#d9534f' }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full">
        
        <div class="mb-8 text-center">
            <img src="/static/images/logonetsup.png" alt="NETSUP Logo" class="h-16 mx-auto mb-4 object-contain">
            <div class="h-px w-16 bg-slate-200 mx-auto rounded-full"></div>
        </div>

        {% if messages %}
            {% for message in messages %}
            <div class="alert alert-error mb-6 rounded-xl text-white font-semibold shadow-sm border-none py-3">
                <i data-lucide="alert-circle" class="w-4 h-4"></i>
                <span class="text-xs uppercase tracking-wider">{{ message }}</span>
            </div>
            {% endfor %}
        {% endif %}

        <div class="bg-white rounded-3xl border border-slate-200 shadow-xl shadow-slate-200/50 overflow-hidden">
            <div class="p-8 md:p-10">
                <div class="mb-8 text-center">
                    <h2 class="text-xl font-bold text-slate-800">Espace de Contrôle</h2>
                    <p class="text-slate-400 text-[10px] font-bold uppercase tracking-[0.15em] mt-1">Superviseurs & Direction</p>
                </div>

                <form method="POST" class="space-y-4">
                    {% csrf_token %}

                    <div class="form-control">
                        <label class="label pt-0">
                            <span class="label-text text-[11px] font-bold text-slate-500 uppercase">Identifiant Téléphone</span>
                        </label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400">
                                <i data-lucide="phone" class="w-4 h-4"></i>
                            </span>
                            <input 
                                type="text" 
                                name="telephone" 
                                placeholder="ex: 70000000"
                                class="input input-bordered w-full pl-11 rounded-xl text-sm font-semibold text-slate-700 bg-slate-50 border-slate-200 focus:bg-white focus:border-brandBlue focus:ring-0 transition-all" 
                                required
                            >
                        </div>
                    </div>

                    <div class="form-control">
                        <label class="label pt-0">
                            <span class="label-text text-[11px] font-bold text-slate-500 uppercase">Mot de passe</span>
                        </label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400">
                                <i data-lucide="lock" class="w-4 h-4"></i>
                            </span>
                            <input 
                                id="password-input"
                                type="password" 
                                name="password" 
                                placeholder="••••••••"
                                class="input input-bordered w-full px-11 rounded-xl text-sm font-semibold text-slate-700 bg-slate-50 border-slate-200 focus:bg-white focus:border-brandBlue focus:ring-0 transition-all" 
                                required
                            >
                            <button 
                                type="button"
                                onclick="togglePassword()"
                                class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-brandBlue transition-colors"
                            >
                                <i id="password-icon" data-lucide="eye" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>

                    <div class="pt-4">
                        <button type="submit" class="btn btn-primary w-full bg-brandBlue hover:bg-blue-700 border-none text-white font-bold uppercase tracking-widest h-12 rounded-xl shadow-lg shadow-blue-100 transition-all active:scale-95">
                            Accéder à la plateforme
                        </button>
                    </div>
                </form>
            </div>

            <div class="bg-slate-50 p-4 border-t border-slate-100 text-center">
                <p class="text-[9px] text-slate-400 font-bold uppercase tracking-[0.2em]">
                    Soutien Technique : <span class="text-slate-600">NETSUP MALI</span>
                </p>
            </div>
        </div>
        
        <p class="text-center mt-6 text-slate-400 text-[10px] font-bold uppercase tracking-widest">
            &copy; 2026 Tous droits réservés
        </p>
    </div>

    <script>
        // Initialisation des icônes Lucide
        lucide.createIcons();

        // Fonction pour basculer la visibilité du mot de passe
        function togglePassword() {
            const passwordInput = document.getElementById('password-input');
            const passwordIcon = document.getElementById('password-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordIcon.setAttribute('data-lucide', 'eye-off');
            } else {
                passwordInput.type = 'password';
                passwordIcon.setAttribute('data-lucide', 'eye');
            }
            // Re-générer l'icône modifiée
            lucide.createIcons();
        }
    </script>
</body>
</html>
