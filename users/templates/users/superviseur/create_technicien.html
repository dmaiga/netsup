<!-- templates/users/superviseur/create_technicien.html -->

{% extends "base_sup.html" %}

{% block content %}

<div class="max-w-3xl mx-auto p-6">

    <div class="mb-6">
        <h1 class="text-3xl font-bold">
            Ajouter un technicien
        </h1>

        <p class="text-base-content/70 mt-2">
            Créer une nouvelle fiche technicien.
        </p>
    </div>

    <div class="card bg-base-100 shadow-md border border-base-200">

        <div class="card-body">

            <form method="post" enctype="multipart/form-data">

                {% csrf_token %}

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

                    <div>
                        <label class="label">
                            <span class="label-text">
                                Nom
                            </span>
                        </label>

                        {{ form.nom }}
                    </div>

                    <div>
                        <label class="label">
                            <span class="label-text">
                                Prénom
                            </span>
                        </label>

                        {{ form.prenom }}
                    </div>

                    <div>
                        <label class="label">
                            <span class="label-text">
                                Téléphone
                            </span>
                        </label>

                        {{ form.telephone }}
                    </div>

                    <div>
                        <label class="label">
                            <span class="label-text">
                                Genre
                            </span>
                        </label>

                        {{ form.genre }}
                    </div>

                    <div class="md:col-span-2">
                        <label class="label">
                            <span class="label-text">
                                Photo
                            </span>
                        </label>

                        {{ form.photo }}
                    </div>

                </div>

                <div class="mt-8 flex justify-end">

                    <button type="submit" class="btn btn-primary">
                        Ajouter le technicien
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
